<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="541px" preserveAspectRatio="none" style="width:317px;height:541px;background:#FFFFFF;" version="1.1" viewBox="0 0 317 541" width="317px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="257.4375" x="22.7813" y="24.5332">add(1, 99) &#8212; Estado antes y despu&#233;s</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.4375" x="70.2813" y="42.1426">n = 3, r = 2 &#8594; n = 4, r = 3</text><g id="ANTES"><rect fill="#E0F2F1" height="113.0781" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="115" x="115.5" y="63.2188"/><line style="stroke:#00695C;stroke-width:0.5;" x1="115.5" x2="230.5" y1="90.8281" y2="90.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="155" y="82.752">Antes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="120.5" y="108.2852">n = 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="120.5" y="123.3789">blocks.size() = 2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80" x="120.5" y="138.4727">Capacidad = 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="120.5" y="153.5664">Bloque 0: [10]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95" x="120.5" y="168.6602">Bloque 1: [20, 30]</text></g><g id="DESPUES"><rect fill="#E0F2F1" height="128.1719" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="121" x="35.5" y="254.2188"/><line style="stroke:#00695C;stroke-width:0.5;" x1="35.5" x2="156.5" y1="281.8281" y2="281.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56" x="68" y="273.752">Despu&#233;s</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="40.5" y="299.2852">n = 4</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="40.5" y="314.3789">blocks.size() = 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80" x="40.5" y="329.4727">Capacidad = 6</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="40.5" y="344.5664">Bloque 0: [10]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95" x="40.5" y="359.6602">Bloque 1: [20, 99]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101" x="40.5" y="374.7539">Bloque 2: [30, ?, ?]</text></g><g id="elem_GMN5"><path d="M192,296.7188 L192,339.4219 L310,339.4219 L310,306.7188 L300,296.7188 L192,296.7188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M300,296.7188 L300,306.7188 L310,306.7188 L300,296.7188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75" x="198" y="315.2139">2&#183;3/2 = 3 = n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97" x="198" y="331.5654">Capacidad justa.</text></g><g id="elem_GMN8"><path d="M6,443.2188 L6,534.9766 A0,0 0 0 0 6,534.9766 L186,534.9766 A0,0 0 0 0 186,534.9766 L186,453.2188 L176,443.2188 L100,443.2188 L96,382.6287 L92,443.2188 L6,443.2188 A0,0 0 0 0 6,443.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M176,443.2188 L176,453.2188 L186,453.2188 L176,443.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144" x="12" y="461.7139">Se llam&#243; a grow() porque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="12" y="478.0654">3 &lt; n+1 = 4.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="12" y="494.417">El bloque 2 tiene tama&#241;o 3.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="12" y="510.7686">El 30 se desplaz&#243; a la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="12" y="527.1201">posici&#243;n 3 del bloque 2.</text></g><!--link ANTES to DESPUES--><g id="link_ANTES_DESPUES"><path d="M151.24,176.2387 C141.77,200.4088 132.8098,223.2826 123.0098,248.2826 " fill="none" id="ANTES-to-DESPUES" style="stroke:#00695C;stroke-width:1.0;"/><polygon fill="#00695C" points="120.82,253.8687,127.8287,246.9494,122.6448,249.2136,120.3806,244.0297,120.82,253.8687" style="stroke:#00695C;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58" x="141" y="220.7139">add(1, 99)</text></g><!--link ANTES to GMN5--><g id="link_ANTES_GMN5"><path d="M195.93,176.3087 C199.99,186.2588 204.14,196.5288 208,206.2188 C220.54,237.7088 234.66,274.4088 243.19,296.7188 " fill="none" id="ANTES-GMN5" style="stroke:#00695C;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TPB1JkCm48RlVeeHN42qtIHkAu9OK2d9SONKtHDm66g3GbqxsAuG8AGzyG28b-28EEnz-oOy2PCqqBG5ALRi-MR6_up7ZJATeyKnE8zU7k1mT67DH8k-KSR2UXAaKHeoj-Hch92sSWc2RjpfrrpGMdFz7TJcYrlID8txxMMl-YLftDkEEepvp2i9ACH6s80uteItlq-Ga2XX0BMN3cv0I9TFfi_kH6lu2Rm1bduHl3qyGc5epmoSiR8MMEiLSMk03dg_VYS3k6DGxNRA05uxdoap7BcMosxbncQHjiRwcECm4oYMOWwKkPf827RWE0nELq5880eQm0dUVwewhAeeXHqcWwC_bRIF_KnSUy6oB8y