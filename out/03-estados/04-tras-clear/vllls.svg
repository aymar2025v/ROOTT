<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="509px" preserveAspectRatio="none" style="width:398px;height:509px;background:#FFFFFF;" version="1.1" viewBox="0 0 398 509" width="398px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234.4375" x="75.0313" y="24.5332">clear() &#8212; Estado antes y despu&#233;s</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.4375" x="111.0313" y="42.1426">n = 6, r = 3 &#8594; n = 0, r = 0</text><g id="ANTES"><rect fill="#FFEBEE" height="128.1719" rx="12.5" ry="12.5" style="stroke:#C62828;stroke-width:0.5;" width="191" x="107.5" y="63.2188"/><line style="stroke:#C62828;stroke-width:0.5;" x1="107.5" x2="298.5" y1="90.8281" y2="90.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="185" y="82.752">Antes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="112.5" y="108.2852">n = 6</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="112.5" y="123.3789">blocks.size() = 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="112.5" y="138.4727">Bloque 0: [10]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95" x="112.5" y="153.5664">Bloque 1: [20, 30]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115" x="112.5" y="168.6602">Bloque 2: [40, 50, 60]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171" x="112.5" y="183.7539">Memoria de bloques reservada</text></g><g id="DESPUES"><rect fill="#FFEBEE" height="113.0781" rx="12.5" ry="12.5" style="stroke:#C62828;stroke-width:0.5;" width="182" x="7" y="269.2188"/><line style="stroke:#C62828;stroke-width:0.5;" x1="7" x2="189" y1="296.8281" y2="296.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56" x="70" y="288.752">Despu&#233;s</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="12" y="314.2852">n = 0</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="12" y="329.3789">blocks.size() = 0</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117" x="12" y="344.4727">Sin bloques de datos</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162" x="12" y="359.5664">Memoria liberada con delete[]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104" x="12" y="374.6602">blocks.a.length &#8805; 1</text></g><g id="elem_GMN5"><path d="M224.5,304.2188 L224.5,346.9219 A0,0 0 0 0 224.5,346.9219 L391.5,346.9219 A0,0 0 0 0 391.5,346.9219 L391.5,314.2188 L381.5,304.2188 L300.94,304.2188 L236.8,191.4788 L292.94,304.2188 L224.5,304.2188 A0,0 0 0 0 224.5,304.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M381.5,304.2188 L381.5,314.2188 L391.5,314.2188 L381.5,304.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127" x="230.5" y="322.7139">Los 3 bloques ocupan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="230.5" y="339.0654">1 + 2 + 3 = 6 posiciones.</text></g><g id="elem_GMN8"><path d="M10.5,443.2188 L10.5,502.2734 A0,0 0 0 0 10.5,502.2734 L185.5,502.2734 A0,0 0 0 0 185.5,502.2734 L185.5,4