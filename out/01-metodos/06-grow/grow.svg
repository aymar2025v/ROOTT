<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1470px" preserveAspectRatio="none" style="width:457px;height:1470px;background:#FFFFFF;" version="1.1" viewBox="0 0 457 1470" width="457px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="286.4375" x="83.7813" y="34.5332">grow() &#8212; A&#241;adir un nuevo bloque al final</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="258" x="98" y="52.1426">O(r) en el peor caso, O(1) amortizado</text><path d="M22.5,66.2188 L22.5,239.7344 L236.5,239.7344 L236.5,76.2188 L226.5,66.2188 L22.5,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M226.5,66.2188 L226.5,76.2188 L236.5,76.2188 L226.5,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="28.5" y="84.7139">Idea</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="28.5" y="101.0654">Los bloques tienen tama&#241;os:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="36.5" y="117.417">1, 2, 3, 4, ...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="28.5" y="133.7686">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149" x="28.5" y="150.1201">Si hay r bloques, el nuevo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124" x="28.5" y="166.4717">bloque tendr&#225; &#237;ndice r</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81" x="28.5" y="182.8232">y tama&#241;o r+1.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="28.5" y="199.1748">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="28.5" y="215.5264">r = blocks.size()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193" x="28.5" y="231.8779">tama&#241;o nuevo = blocks.size() + 1</text><ellipse cx="129.5" cy="259.7344" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F8F8F8" height="118.0156" style="stroke:#A80036;stroke-width:1.5;" width="412" x="31.5" y="279.7344"/><path d="M91.5,279.7344 L91.5,290.3438 L81.5,300.3438 L31.5,300.3438 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50" x="34.5" y="295.2676">Entrada</text><path d="M237.5,310.3438 L237.5,344.0469 L217.5,348.0469 L237.5,352.0469 L237.5,385.75 A0,0 0 0 0 237.5,385.75 L433.5,385.75 A0,0 0 0 0 433.5,385.75 L433.5,320.3438 L423.5,310.3438 L237.5,310.3438 A0,0 0 0 0 237.5,310.3438 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M423.5,310.3438 L423.5,320.3438 L433.5,320.3438 L423.5,310.3438 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="243.5" y="328.8389">Se invoca solo si la capacidad</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161" x="243.5" y="345.1904">actual no alcanza para n+1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="243.5" y="361.542">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88" x="243.5" y="377.8936">r(r+1)/2 &lt; n + 1</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="176" x="41.5" y="330.5"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156" x="51.5" y="352.957">grow() se llama desde add()</text><rect fill="#F8F8F8" height="183.4219" style="stroke:#A80036;stroke-width:1.5;" width="404" x="37.5" y="407.75"/><path d="M327.5,407.75 L327.5,418.3594 L317.5,428.3594 L37.5,428.3594 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280" x="40.5" y="423.2832">Paso 1: calcular el tama&#241;o del nuevo bloque</text><path d="M231.5,438.3594 L231.5,504.7656 L211.5,508.7656 L231.5,512.7656 L231.5,579.1719 A0,0 0 0 0 231.5,579.1719 L431.5,579.1719 A0,0 0 0 0 431.5,579.1719 L431.5,448.3594 L421.5,438.3594 L231.5,438.3594 A0,0 0 0 0 231.5,438.3594 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M421.5,438.3594 L421.5,448.3594 L431.5,448.3594 L421.5,438.3594 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="237.5" y="456.8545">Si hay 0 bloques &#8594; tama&#241;o 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="237.5" y="473.2061">Si hay 1 bloque  &#8594; tama&#241;o 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="237.5" y="489.5576">Si hay 2 bloques &#8594; tama&#241;o 3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="12" x="237.5" y="505.9092">...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="237.5" y="522.2607">Si hay r bloques &#8594; tama&#241;o r+1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="237.5" y="538.6123">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121" x="237.5" y="554.9639">Coincide con la regla</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168" x="237.5" y="571.3154">"bloque b tiene tama&#241;o b+1".</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="164" x="47.5" y="491.2188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144" x="57.5" y="513.6758">tama&#241;o = blocks.size() + 1</text><rect fill="#F8F8F8" height="199.7734" style="stroke:#A80036;stroke-width:1.5;" width="383" x="45.5" y="601.1719"/><path d="M313.5,601.1719 L313.5,611.7813 L303.5,621.7813 L45.5,621.7813 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258" x="48.5" y="616.7051">Paso 2: reservar memoria para el bloque</text><path d="M223.5,631.7813 L223.5,706.3633 L203.5,710.3633 L223.5,714.3633 L223.5,788.9453 A0,0 0 0 0 223.5,788.9453 L418.5,788.9453 A0,0 0 0 0 418.5,788.9453 L418.5,641.7813 L408.5,631.7813 L223.5,631.7813 A0,0 0 0 0 223.5,631.7813 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M408.5,631.7813 L408.5,641.7813 L418.5,641.7813 L408.5,631.7813 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="229.5" y="650.2764">Reserva un arreglo din&#225;mico</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126" x="229.5" y="666.6279">de T con ese tama&#241;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="229.5" y="682.9795">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68" x="229.5" y="699.3311">Devuelve un</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8" x="301.5" y="699.3311">T</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="309.5" y="699.3311">* que apunta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174" x="229.5" y="715.6826">al primer elemento del bloque.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="229.5" y="732.0342">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22" x="229.5" y="748.3857">Ojo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="251.5" y="748.3857">: si T es una clase,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="229.5" y="764.7373">se llama al constructor por</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153" x="229.5" y="781.0889">defecto de cada elemento.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="148" x="55.5" y="692.8164"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128" x="65.5" y="715.2734">new T[blocks.size() + 1]</text><rect fill="#F8F8F8" height="248.8281" style="stroke:#A80036;stroke-width:1.5;" width="435" x="11" y="810.9453"/><path d="M298,810.9453 L298,821.5547 L288,831.5547 L11,831.5547 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277" x="14" y="826.4785">Paso 3: insertar el puntero al final de blocks</text><path d="M258,841.5547 L258,940.6641 L238,944.6641 L258,948.6641 L258,1047.7734 A0,0 0 0 0 258,1047.7734 L436,1047.7734 A0,0 0 0 0 436,1047.7734 L436,851.5547 L426,841.5547 L258,841.5547 A0,0 0 0 0 258,841.5547 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M426,841.5547 L426,851.5547 L436,851.5547 L426,841.5547 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157" x="264" y="860.0498">blocks es ArrayStack&lt;T*&gt;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="264" y="876.4014">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="264" y="892.7529">add(i, x) inserta x en la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59" x="264" y="909.1045">posici&#243;n i.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="264" y="925.4561">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135" x="264" y="941.8076">Como i = blocks.size(),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57" x="264" y="958.1592">se inserta</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44" x="325" y="958.1592">al final</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="369" y="958.1592">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="264" y="974.5107">equivalente a un push.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="264" y="990.8623">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134" x="264" y="1007.2139">Si ArrayStack necesita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144" x="264" y="1023.5654">crecer su arreglo interno,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121" x="264" y="1039.917">lo hace aqu&#237; (resize).</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="217" x="21" y="927.1172"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197" x="31" y="949.5742">blocks.add(blocks.size(), nuevo_ptr)</text><rect fill="#F8F8F8" height="139.7969" style="stroke:#A80036;stroke-width:1.5;" width="188" x="35.5" y="1069.7734"/><path d="M84.5,1069.7734 L84.5,1080.3828 L74.5,1090.3828 L35.5,1090.3828 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="38.5" y="1085.3066">Salida</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="168" x="45.5" y="1107.3828"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148" x="55.5" y="1129.8398">blocks.size() aumenta en 1</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="167" x="46" y="1162.4766"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="56" y="1184.9336">n NO cambia (lo hace add)</text><path d="M160.5,1219.5703 L160.5,1458.4922 L356.5,1458.4922 L356.5,1229.5703 L346.5,1219.5703 L160.5,1219.5703 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M346.5,1219.5703 L346.5,1229.5703 L356.5,1229.5703 L346.5,1219.5703 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="166.5" y="1238.0654">Estado inicial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="166.5" y="1254.417">blocks.size() = r</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="166.5" y="1270.7686">capacidad total = r(r+1)/2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136" x="166.5" y="1287.1201">n = elementos actuales</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="166.5" y="1303.4717">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74" x="166.5" y="1319.8232">Estado final</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117" x="166.5" y="1336.1748">blocks.size() = r + 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="166.5" y="1352.5264">capacidad total = (r+1)(r+2)/2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81" x="166.5" y="1368.8779">n sin cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="166.5" y="1385.2295">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="166.5" y="1401.5811">Complejidad:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93" x="166.5" y="1417.9326">new T[k] &#8594; O(k)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="166.5" y="1434.2842">blocks.add &#8594; O(1) amortizado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166" x="166.5" y="1450.6357">Total &#8594; O(r) amortizado O(1)</text><ellipse cx="129.5" cy="1339.0313" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="129.5" cy="1339.0313" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="269.7344" y2="330.5"/><polygon fill="#A80036" points="125.5,320.5,129.5,330.5,133.5,320.5,129.5,324.5" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="365.5938" y2="491.2188"/><polygon fill="#A80036" points="125.5,481.2188,129.5,491.2188,133.5,481.2188,129.5,485.2188" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="526.3125" y2="692.8164"/><polygon fill="#A80036" points="125.5,682.8164,129.5,692.8164,133.5,682.8164,129.5,686.8164" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="727.9102" y2="927.1172"/><polygon fill="#A80036" points="125.5,917.1172,129.5,927.1172,133.5,917.1172,129.5,921.1172" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="1142.4766" y2="1162.4766"/><polygon fill="#A80036" points="125.5,1152.4766,129.5,1162.4766,133.5,1152.4766,129.5,1156.4766" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="962.2109" y2="1107.3828"/><polygon fill="#A80036" points="125.5,1097.3828,129.5,1107.3828,133.5,1097.3828,129.5,1101.3828" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="129.5" x2="129.5" y1="1197.5703" y2="1328.0313"/><polygon fill="#A80036" points="125.5,1318.0313,129.5,1328.0313,133.5,1318.0313,129.5,1322.0313" s