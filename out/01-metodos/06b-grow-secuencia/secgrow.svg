" textLength="49" x="371" y="500.8936">(al final).</text><polygon fill="#181818" points="483.5,532.1016,493.5,536.1016,483.5,540.1016,487.5,536.1016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.3;" x1="360.5" x2="489.5" y1="536.1016" y2="536.1016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116" x="370" y="531.2451">a[2] = nuevo_bloque</text><path d="M510,549.1016 L510,591.1016 L670,591.1016 L670,559.1016 L660,549.1016 L510,549.1016 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M660,549.1016 L660,559.1016 L670,559.1016 L660,549.1016 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139" x="516" y="567.5967">Asignaci&#243;n en el arreglo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="516" y="583.9482">interno de punteros.</text><polygon fill="#181818" points="371.5,615.1563,361.5,619.1563,371.5,623.1563,367.5,619.1563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.3;stroke-dasharray:2.0,2.0;" x1="365.5" x2="499.5" y1="619.1563" y2="619.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="14" x="423.5" y="614.2998">ok</text><path d="M284,634.1563 L345,634.1563 L345,642.5078 L335,652.5078 L284,652.5078 L284,634.1563 " fill="#F8F8F8" style="stroke:#A80036;stroke-width:1.5;"/><rect fill="none" height="130.7578" style="stroke:#A80036;stroke-width:1.5;" width="270" x="284" y="634.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="16" x="299" y="648.6514">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157" x="360" y="647.5752">[ArrayStack necesita crecer]</text>