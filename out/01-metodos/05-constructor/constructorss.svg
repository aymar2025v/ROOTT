<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1312px" preserveAspectRatio="none" style="width:494px;height:1312px;background:#FFFFFF;" version="1.1" viewBox="0 0 494 1312" width="494px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="330.4375" x="80.2813" y="34.5332">RootishArrayStack() &#8212; Constructor por defecto</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="291" x="100" y="52.1426">Crea la estructura vac&#237;a, lista para usarse</text><path d="M25.5,66.2188 L25.5,207.0313 L226.5,207.0313 L226.5,76.2188 L216.5,66.2188 L25.5,66.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M216.5,66.2188 L216.5,76.2188 L226.5,76.2188 L216.5,66.2188 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="31.5" y="84.7139">Idea</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180" x="31.5" y="101.0654">Al crear un RootishArrayStack:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="31.5" y="117.417">- n = 0          (sin elementos)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165" x="31.5" y="133.7686">- blocks vac&#237;o   (sin bloques)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="31.5" y="150.1201">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152" x="31.5" y="166.4717">El primer bloque se crear&#225;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="31.5" y="182.8232">con la primera llamada a add()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122" x="31.5" y="199.1748">que invoque a grow().</text><ellipse cx="126" cy="227.0313" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#E0F2F1" height="99.7969" style="stroke:#00695C;stroke-width:1.5;" width="447" x="14.5" y="247.0313"/><path d="M187.5,247.0313 L187.5,257.6406 L177.5,267.6406 L14.5,267.6406 " fill="none" style="stroke:#00695C;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163" x="17.5" y="262.5645">Entrada: se crea el objeto</text><path d="M247.5,288.3828 L247.5,305.7344 L227.5,309.7344 L247.5,313.7344 L247.5,331.0859 A0,0 0 0 0 247.5,331.0859 L451.5,331.0859 A0,0 0 0 0 451.5,331.0859 L451.5,298.3828 L441.5,288.3828 L247.5,288.3828 A0,0 0 0 0 247.5,288.3828 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M441.5,288.3828 L441.5,298.3828 L451.5,298.3828 L441.5,288.3828 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51" x="253.5" y="306.8779">Ejemplo:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="253.5" y="323.2295">ods::RootishArrayStack&lt;int&gt; s;</text><rect fill="#E0F2F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="203" x="24.5" y="284.6406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129" x="34.5" y="307.0977">Se declara una variable</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183" x="34.5" y="322.1914">o se hace new RootishArrayStack</text><rect fill="#E0F2F1" height="291.375" style="stroke:#00695C;stroke-width:1.5;" width="472" x="11" y="356.8281"/><path d="M307,356.8281 L307,367.4375 L297,377.4375 L11,377.4375 " fill="none" style="stroke:#00695C;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286" x="14" y="372.3613">Paso 1: inicializar miembros autom&#225;ticamente</text><path d="M251,387.4375 L251,478.3711 L231,482.3711 L251,486.3711 L251,577.3047 A0,0 0 0 0 251,577.3047 L473,577.3047 A0,0 0 0 0 473,577.3047 L473,397.4375 L463,387.4375 L251,387.4375 A0,0 0 0 0 251,387.4375 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M463,387.4375 L463,397.4375 L473,397.4375 L463,387.4375 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="257" y="405.9326">Como no se menciona blocks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="257" y="422.2842">en la lista de inicializaci&#243;n,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141" x="257" y="438.6357">el compilador llama a su</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="257" y="454.9873">constructor por defecto.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="257" y="471.3389">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96" x="257" y="487.6904">Ese constructor:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193" x="265" y="504.042">- crea array&lt;T*&gt; con capacidad 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112" x="265" y="520.3936">- pone blocks.n = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="257" y="536.7451">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="257" y="553.0967">blocks.a.length = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="257" y="569.4482">blocks.n = 0</text><rect fill="#E0F2F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="210" x="21" y="457.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190" x="31" y="479.7344">Se llama al constructor por defecto</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="31" y="494.8281">de blocks (ArrayStack&lt;T*&gt;)</text><path d="M193.5,593.5 L193.5,610.8516 L173.5,614.8516 L193.5,618.8516 L193.5,636.2031 A0,0 0 0 0 193.5,636.2031 L359.5,636.2031 A0,0 0 0 0 359.5,636.2031 L359.5,603.5 L349.5,593.5 L193.5,593.5 A0,0 0 0 0 193.5,593.5 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M349.5,593.5 L349.5,603.5 L359.5,603.5 L349.5,593.5 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145" x="199.5" y="611.9951">El cuerpo del constructor</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="199.5" y="628.3467">asigna n = 0.</text><rect fill="#E0F2F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="95" x="78.5" y="597.3047"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="88.5" y="619.7617">Se inicializa n</text><rect fill="#E0F2F1" height="167.0703" style="stroke:#00695C;stroke-width:1.5;" width="294" x="92.5" y="658.2031"/><path d="M296.5,658.2031 L296.5,668.8125 L286.5,678.8125 L92.5,678.8125 " fill="none" style="stroke:#00695C;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194" x="95.5" y="673.7363">Paso 2: cuerpo del constructor</text><path d="M169.5,688.8125 L169.5,747.043 L149.5,751.043 L169.5,755.043 L169.5,813.2734 A0,0 0 0 0 169.5,813.2734 L376.5,813.2734 A0,0 0 0 0 376.5,813.2734 L376.5,698.8125 L366.5,688.8125 L169.5,688.8125 A0,0 0 0 0 169.5,688.8125 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M366.5,688.8125 L366.5,698.8125 L376.5,698.8125 L366.5,688.8125 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="175.5" y="707.3076">n representa cu&#225;ntos elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106" x="175.5" y="723.6592">hay almacenados.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="175.5" y="740.0107">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="175.5" y="756.3623">Al inicio no hay ninguno.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="175.5" y="772.7139">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="175.5" y="789.0654">No se reserva ning&#250;n bloque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98" x="175.5" y="805.417">de datos todav&#237;a.</text><rect fill="#E0F2F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="47" x="102.5" y="733.4961"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="112.5" y="755.9531">n = 0</text><rect fill="#E0F2F1" height="134.3672" style="stroke:#00695C;stroke-width:1.5;" width="335" x="40" y="835.2734"/><path d="M89,835.2734 L89,845.8828 L79,855.8828 L40,855.8828 " fill="none" style="stroke:#00695C;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="43" y="850.8066">Salida</text><path d="M222,865.8828 L222,907.7617 L202,911.7617 L222,915.7617 L222,957.6406 A0,0 0 0 0 222,957.6406 L365,957.6406 A0,0 0 0 0 365,957.6406 L365,875.8828 L355,865.8828 L222,865.8828 A0,0 0 0 0 222,865.8828 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M355,865.8828 L355,875.8828 L365,875.8828 L355,865.8828 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45" x="228" y="884.3779">Estado:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="30" x="228" y="900.7295">n = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97" x="228" y="917.0811">blocks.size() = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="228" y="933.4326">blocks.a.length = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122" x="228" y="949.7842">Sin bloques de datos</text><rect fill="#E0F2F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#00695C;stroke-width:0.5;" width="152" x="50" y="894.2148"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132" x="60" y="916.6719">Objeto listo para usarse</text><path d="M157,979.6406 L157,1300.3203 L352,1300.3203 L352,989.6406 L342,979.6406 L157,979.6406 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M342,979.6406 L342,989.6406 L352,989.6406 L342,979.6406 " fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="163" y="998.1357">Estado inicial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100" x="163" y="1014.4873">(no existe objeto)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="163" y="1030.8389">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74" x="163" y="1047.1904">Estado final</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="30" x="163" y="1063.542">n = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71" x="163" y="1079.8936">blocks vac&#237;o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136" x="163" y="1096.2451">Capacidad de blocks: 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122" x="163" y="1112.5967">Sin bloques de datos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="163" y="1128.9482">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="163" y="1145.2998">Complejidad:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25" x="252" y="1145.2998">O(1)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134" x="163" y="1161.6514">Solo se inicializa un int</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="163" y="1178.0029">y se crea un arreglo de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134" x="163" y="1194.3545">capacidad 1 en blocks.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="163" y="1210.7061">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161" x="163" y="1227.0576">Nota sobre inicializaci&#243;n:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174" x="163" y="1243.4092">Alternativa idiom&#225;tica en C++:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="171" y="1259.7607">RootishArrayStack() : n(0) {}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141" x="163" y="1276.1123">El libro usa { n = 0; } por</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69" x="163" y="1292.4639">simplicidad.</text><ellipse cx="126" cy="1139.9805" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="126" cy="1139.9805" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#00695C;stroke-width:1.0;" x1="126" x2="126" y1="237.0313" y2="284.6406"/><polygon fill="#00695C" points="122,274.6406,126,284.6406,130,274.6406,126,278.6406" style="stroke:#00695C;stroke-width:1.0;"/><line style="stroke:#00695C;stroke-width:1.0;" x1="126" x2="126" y1="507.4648" y2="597.3047"/><polygon fill="#00695C" points="122,587.3047,126,597.3047,130,587.3047,126,591.3047" style="stroke:#00695C;stroke-width:1.0;"/><line style="stroke:#00695C;stroke-width:1.0;" x1="126" x2="126" y1="334.8281" y2="457.2773"/><polygon fill="#00695C" points="122,447.2773,126,457.2773,130,447.2773,126,451.2773" style="stroke:#00695C;stroke-width:1.0;"/><line style="stroke:#00695C;stroke-width:1.0;" x1="126" x2="126" y1="632.3984" y2="733.4961"/><polygon fill="#00695C" points="122,723.496