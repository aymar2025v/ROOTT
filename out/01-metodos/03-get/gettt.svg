<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1298px" preserveAspectRatio="none" style="width:456px;height:1298px;background:#FFFFFF;" version="1.1" viewBox="0 0 456 1298" width="456px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="321.4375" x="65.7813" y="34.5332">get(i) &#8212; Devolver el elemento en la posici&#243;n i</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="225.4375" x="113.7813" y="52.1426">O(1) &#8212; no modifica la estructura</text><path d="M10,66.2188 L10,207.0313 L255,207.0313 L255,76.2188 L245,66.2188 L10,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M245,66.2188 L245,76.2188 L255,76.2188 L245,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="82" x="16" y="84.7139">Recordatorio</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224" x="16" y="101.0654">Los bloques tienen tama&#241;os 1, 2, 3, ...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153" x="16" y="117.417">Bloque b contiene &#237;ndices:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="24" y="133.7686">inicio = b(b+1)/2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136" x="24" y="150.1201">fin    = (b+1)(b+2)/2 &#8722; 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="16" y="166.4717">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="43" x="16" y="182.8232">get usa</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="19" x="63" y="182.8232">i2b</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71" x="86" y="182.8232">para hallar b</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="16" y="199.1748">y luego calcula j dentro del bloque.</text><ellipse cx="132.5" cy="227.0313" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F8F8F8" height="101.6641" style="stroke:#A80036;stroke-width:1.5;" width="356" x="50" y="247.0313"/><path d="M110,247.0313 L110,257.6406 L100,267.6406 L50,267.6406 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50" x="53" y="262.5645">Entrada</text><path d="M225,277.6406 L225,303.168 L205,307.168 L225,311.168 L225,336.6953 A0,0 0 0 0 225,336.6953 L396,336.6953 A0,0 0 0 0 396,336.6953 L396,287.6406 L386,277.6406 L225,277.6406 A0,0 0 0 0 225,277.6406 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M386,277.6406 L386,287.6406 L396,287.6406 L386,277.6406 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="231" y="296.1357">Condici&#243;n: 0 &#8804; i &lt; n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150" x="231" y="312.4873">get NO modifica n, blocks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71" x="231" y="328.8389">ni los datos.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="145" x="60" y="289.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125" x="70" y="312.0781">Recibe i (&#237;ndice l&#243;gico)</text><rect fill="#F8F8F8" height="118.0156" style="stroke:#A80036;stroke-width:1.5;" width="299" x="88.5" y="358.6953"/><path d="M263.5,358.6953 L263.5,369.3047 L253.5,379.3047 L88.5,379.3047 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="91.5" y="374.2285">Paso 1: localizar el bloque</text><path d="M186.5,389.3047 L186.5,423.0078 L166.5,427.0078 L186.5,431.0078 L186.5,464.7109 A0,0 0 0 0 186.5,464.7109 L377.5,464.7109 A0,0 0 0 0 377.5,464.7109 L377.5,399.3047 L367.5,389.3047 L186.5,389.3047 A0,0 0 0 0 186.5,389.3047 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M367.5,389.3047 L367.5,399.3047 L377.5,399.3047 L367.5,389.3047 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151" x="192.5" y="407.7998">Usa la f&#243;rmula cuadr&#225;tica:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="192.5" y="424.1514">b = ceil( (&#8722;3 + &#8730;(9 + 8i)) / 2 )</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="192.5" y="440.5029">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49" x="192.5" y="456.8545">Es O(1).</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="68" x="98.5" y="409.4609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="48" x="108.5" y="431.918">b = i2b(i)</text><rect fill="#F8F8F8" height="199.7734" style="stroke:#A80036;stroke-width:1.5;" width="349" x="73" y="486.7109"/><path d="M355,486.7109 L355,497.3203 L345,507.3203 L73,507.3203 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272" x="76" y="502.2441">Paso 2: calcular posici&#243;n dentro del bloque</text><path d="M202,517.3203 L202,591.9023 L182,595.9023 L202,599.9023 L202,674.4844 A0,0 0 0 0 202,674.4844 L412,674.4844 A0,0 0 0 0 412,674.4844 L412,527.3203 L402,517.3203 L202,517.3203 A0,0 0 0 0 202,517.3203 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M402,517.3203 L402,527.3203 L412,527.3203 L402,517.3203 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="208" y="535.8154">b(b+1)/2 = elementos en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="208" y="552.167">todos los bloques anteriores</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="208" y="568.5186">al bloque b.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="208" y="584.8701">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189" x="208" y="601.2217">Entonces j es el desplazamiento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="208" y="617.5732">dentro del bloque b.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="208" y="633.9248">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119" x="208" y="650.2764">Ejemplo: i = 4, b = 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="208" y="666.6279">j = 4 &#8722; 2&#183;3/2 = 4 &#8722; 3 = 1</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="99" x="83" y="578.3555"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="79" x="93" y="600.8125">j = i &#8722; b(b+1)/2</text><rect fill="#F8F8F8" height="262.3203" style="stroke:#A80036;stroke-width:1.5;" width="415" x="30" y="696.4844"/><path d="M220,696.4844 L220,707.0938 L210,717.0938 L30,717.0938 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180" x="33" y="712.0176">Paso 3: acceder al elemento</text><path d="M239,727.0938 L239,752.6211 L219,756.6211 L239,760.6211 L239,786.1484 A0,0 0 0 0 239,786.1484 L435,786.1484 A0,0 0 0 0 435,786.1484 L435,737.0938 L425,727.0938 L239,727.0938 A0,0 0 0 0 239,727.0938 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M425,727.0938 L425,737.0938 L435,737.0938 L425,727.0938 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75" x="245" y="745.5889">blocks.get(b)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147" x="245" y="761.9404">devuelve un T* (puntero al</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="245" y="778.292">primer elemento del bloque b).</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="173" x="46" y="739.0742"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153" x="56" y="761.5313">Obtener puntero al bloque b</text><path d="M244,796.1484 L244,838.0273 L224,842.0273 L244,846.0273 L244,887.9063 A0,0 0 0 0 244,887.9063 L395,887.9063 A0,0 0 0 0 395,887.9063 L395,806.1484 L385,796.1484 L244,796.1484 A0,0 0 0 0 244,796.1484 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M385,796.1484 L385,806.1484 L395,806.1484 L385,796.1484 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86" x="250" y="814.6436">blocks.get(b)[j]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="250" y="830.9951">&#8801; *(blocks.get(b) + j)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="250" y="847.3467">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="250" y="863.6982">Suma j&#183;sizeof(T) bytes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92" x="250" y="880.0498">y desreferencia.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="183" x="41" y="824.4805"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163" x="51" y="846.9375">Aplicar aritm&#233;tica de punteros</text><path d="M245,904.1016 L245,921.4531 L225,925.4531 L245,929.4531 L245,946.8047 A0,0 0 0 0 245,946.8047 L408,946.8047 A0,0 0 0 0 408,946.8047 L408,914.1016 L398,904.1016 L245,904.1016 A0,0 0 0 0 245,904.1016 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M398,904.1016 L398,914.1016 L408,914.1016 L398,904.1016 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137" x="251" y="922.5967">get devuelve T por valor,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142" x="251" y="938.9482">as&#237; que se copia el dato.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="185" x="40" y="907.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165" x="50" y="930.3633">Devolver copia del elemento T</text><rect fill="#F8F8F8" height="84.7031" style="stroke:#A80036;stroke-width:1.5;" width="213" x="26" y="968.8047"/><path d="M75,968.8047 L75,979.4141 L65,989.4141 L26,989.4141 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="29" y="984.3379">Salida</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="193" x="36" y="1006.4141"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173" x="46" y="1028.8711">return elemento en la posici&#243;n i</text><path d="M163.5,1063.5078 L163.5,1286.0781 L308.5,1286.0781 L308.5,1073.5078 L298.5,1063.5078 L163.5,1063.5078 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M298.5,1063.5078 L298.5,1073.5078 L308.5,1073.5078 L298.5,1063.5078 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="169.5" y="1082.0029">Estado inicial</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="169.5" y="1098.3545">i = valor de entrada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105" x="169.5" y="1114.7061">n = tama&#241;o actual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="169.5" y="1131.0576">blocks con r bloques</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="169.5" y="1147.4092">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74" x="169.5" y="1163.7607">Estado final</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104" x="169.5" y="1180.1123">Igual que al inicio.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124" x="169.5" y="1196.4639">get no modifica nada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="169.5" y="1212.8154">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85" x="169.5" y="1229.167">Complejidad:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25" x="258.5" y="1229.167">O(1)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50" x="169.5" y="1245.5186">i2b: O(1)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93" x="169.5" y="1261.8701">blocks.get: O(1)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44" x="169.5" y="1278.2217">[j]: O(1)</text><ellipse cx="132.5" cy="1174.793" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="132.5" cy="1174.793" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="237.0313" y2="289.6211"/><polygon fill="#A80036" points="128.5,279.6211,132.5,289.6211,136.5,279.6211,132.5,283.6211" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="324.7148" y2="409.4609"/><polygon fill="#A80036" points="128.5,399.4609,132.5,409.4609,136.5,399.4609,132.5,403.4609" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="444.5547" y2="578.3555"/><polygon fill="#A80036" points="128.5,568.3555,132.5,578.3555,136.5,568.3555,132.5,572.3555" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="774.168" y2="824.4805"/><polygon fill="#A80036" points="128.5,814.4805,132.5,824.4805,136.5,814.4805,132.5,818.4805" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="859.5742" y2="907.9063"/><polygon fill="#A80036" points="128.5,897.9063,132.5,907.9063,136.5,897.9063,132.5,901.9063" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="613.4492" y2="739.0742"/><polygon fill="#A80036" points="128.5,729.0742,132.5,739.0742,136.5,729.0742,132.5,733.0742" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="943" y2="1006.4141"/><polygon fill="#A80036" points="128.5,996.4141,132.5,1006.4141,136.5,996.4141,132.5,1000.4141" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="132.5" x2="132.5" y1="1041.5078" y2="1163.793"/><polygon fill="#A80036" points="128.5,1153.793,132.5,1163.793,136.5,1153.793,132.5,1157.793" style="stroke:#A80036;stroke-width:1.0;"/><!--SRC=[XLL1RzD85BxxLpon5yT4eKaG5BCzq3QLa115I_UqS1ZRap3fU2RCZ8DQXCGHhgizxGrfBtlWiEg1E_ad_ILyCxQJb6HJ9RATUM-Ul-zxRxxOSw5cpB2IMEx4NBYBGvQVJuokL76afJRqoydeP7GqYkncfZO5DqtMa_szlU63BLd7WfLQ5PjbJqQZu-CT6tPMLzhnpPA79uSF7_wSjHkbCVhT_mLnTS89hNRNMALj0DhtdoX2M7AQS1UB3br__8kE-LpBEJV49RwyvCffueeaevcs8XUBAqNYbJgD-_K6fQdKXHYBdFaaRfsfSbSP5aLZgPaJQXBOakHZ5n4boMyy1shcj14wIR3qJ5lAf7vRSKjES8NNELQonNzOxtTfqALXbtgz7b8FGnfbb6iLKcdnLHKYvpP5b4WeGDHqG5cStUrtxWt2wbWeVpkWi8ZB016w_lGdzICaW3vLbW6Q66H9ucLZz8P9oGnbY5-GhFX4KyvaNe7Zb0h8OZHkiW7UYxWg0iyeiWwoHz5IVBepGZOhs1rwZsef-8kCaw2umKvoSJKHkUuyHZXePSJaZGlGZxHFyQgdj4VNd__1lbz9XPZ7_Vnq9R_gUZJvkGrH9KX2G2-qzT8j0NwuWUq5ivhwAN91JrooqFcQL8CtWt0G1XEo1T_lDh