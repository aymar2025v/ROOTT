<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1212px" preserveAspectRatio="none" style="width:622px;height:1212px;background:#FFFFFF;" version="1.1" viewBox="0 0 622 1212" width="622px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="314.4375" x="152.2813" y="34.5332">get(i) &#8212; Obtener el elemento en la posici&#243;n i</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124" x="247.5" y="52.1426">Complejidad: O(1)</text><path d="M10,66.2188 L10,181.875 A0,0 0 0 0 10,181.875 L288,181.875 A0,0 0 0 0 288,181.875 L288,128.0469 L308,124.0469 L288,120.0469 L288,76.2188 L278,66.2188 L10,66.2188 A0,0 0 0 0 10,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M278,66.2188 L278,76.2188 L288,76.2188 L278,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="24" x="16" y="83.6758">Idea</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257" x="16" y="98.7695">Un &#237;ndice l&#243;gico i se traduce a una pareja (b, j):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194" x="16" y="113.8633">- b = bloque donde vive el elemento</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190" x="16" y="128.957">- j = posici&#243;n dentro de ese bloque</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="16" y="144.0508">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247" x="16" y="159.1445">Una vez localizado (b, j), el acceso es directo:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80" x="16" y="174.2383">blocks.get(b)[j]</text><ellipse cx="318" cy="124.0469" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F8F8F8" height="98.4258" style="stroke:#A80036;stroke-width:1.5;" width="331" x="232.5" y="191.875"/><path d="M292.5,191.875 L292.5,202.4844 L282.5,212.4844 L232.5,212.4844 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50" x="235.5" y="207.4082">Entrada</text><path d="M413.5,223.0195 L413.5,246.6602 L393.5,250.6602 L413.5,254.6602 L413.5,278.3008 A0,0 0 0 0 413.5,278.3008 L553.5,278.3008 A0,0 0 0 0 553.5,278.3008 L553.5,233.0195 L543.5,223.0195 L413.5,223.0195 A0,0 0 0 0 413.5,223.0195 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M543.5,223.0195 L543.5,233.0195 L553.5,233.0195 L543.5,223.0195 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106" x="419.5" y="240.4766">Condici&#243;n: 0 &#8804; i &lt; n</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119" x="419.5" y="255.5703">No modifica el objeto.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="419.5" y="270.6641">Podr&#237;a ser const.</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="151" x="242.5" y="232.4844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131" x="252.5" y="255.9795">Recibe i (&#237;ndice l&#243;gico)</text><rect fill="#F8F8F8" height="143.1719" style="stroke:#A80036;stroke-width:1.5;" width="279" x="272.5" y="300.3008"/><path d="M447.5,300.3008 L447.5,310.9102 L437.5,320.9102 L272.5,320.9102 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="275.5" y="315.834">Paso 1: localizar el bloque</text><path d="M373.5,330.9102 L373.5,377.1914 L353.5,381.1914 L373.5,385.1914 L373.5,431.4727 A0,0 0 0 0 373.5,431.4727 L541.5,431.4727 A0,0 0 0 0 541.5,431.4727 L541.5,340.9102 L531.5,330.9102 L373.5,330.9102 A0,0 0 0 0 373.5,330.9102 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M531.5,330.9102 L531.5,340.9102 L541.5,340.9102 L531.5,330.9102 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="70" x="379.5" y="348.3672">i2b resuelve:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="379.5" y="363.4609">b = ceil( (&#8722;3 + &#8730;(9+8i)) / 2 )</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="379.5" y="378.5547">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142" x="379.5" y="393.6484">Devuelve el bloque donde</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78" x="379.5" y="408.7422">vive el &#237;ndice i.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="379.5" y="423.8359">O(1).</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="71" x="282.5" y="363.0156"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51" x="292.5" y="386.5107">b = i2b(i)</text><rect fill="#F8F8F8" height="158.2656" style="stroke:#A80036;stroke-width:1.5;" width="359" x="252" y="453.4727"/><path d="M595,453.4727 L595,464.082 L585,474.082 L252,474.082 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="333" x="255" y="469.0059">Paso 2: calcular el desplazamiento dentro del bloque</text><path d="M394,484.082 L394,537.9102 L374,541.9102 L394,545.9102 L394,599.7383 A0,0 0 0 0 394,599.7383 L601,599.7383 A0,0 0 0 0 601,599.7383 L601,494.082 L591,484.082 L394,484.082 A0,0 0 0 0 394,484.082 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M591,484.082 L591,494.082 L601,494.082 L591,484.082 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151" x="400" y="501.5391">Los bloques anteriores al b</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169" x="400" y="516.6328">suman 0+1+2+...+b = b(b+1)/2.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="400" y="531.7266">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138" x="400" y="546.8203">Entonces j es la posici&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109" x="400" y="561.9141">dentro del bloque b.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="400" y="577.0078">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186" x="400" y="592.1016">Ejemplo: i=4 &#8594; b=2 &#8594; j = 4 &#8722; 3 = 1</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="112" x="262" y="523.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92" x="272" y="547.2295">j = i &#8722; b*(b+1)/2</text><rect fill="#F8F8F8" height="112.9844" style="stroke:#A80036;stroke-width:1.5;" width="360" x="249" y="621.7383"/><path d="M424,621.7383 L424,632.3477 L414,642.3477 L249,642.3477 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="252" y="637.2715">Paso 3: acceder al bloque</text><path d="M397,652.3477 L397,683.5352 L377,687.5352 L397,691.5352 L397,722.7227 A0,0 0 0 0 397,722.7227 L599,722.7227 A0,0 0 0 0 599,722.7227 L599,662.3477 L589,652.3477 L397,652.3477 A0,0 0 0 0 397,652.3477 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M589,652.3477 L589,662.3477 L599,662.3477 L589,652.3477 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142" x="403" y="669.8047">blocks es ArrayStack&lt;T*&gt;.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154" x="403" y="684.8984">blocks.get(b) devuelve un T*</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181" x="403" y="699.9922">que apunta al inicio del bloque b.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="27" x="403" y="715.0859">O(1).</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="118" x="259" y="669.3594"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98" x="269" y="692.8545">p = blocks.get(b)</text><rect fill="#F8F8F8" height="158.2656" style="stroke:#A80036;stroke-width:1.5;" width="302" x="254.5" y="744.7227"/><path d="M417.5,744.7227 L417.5,755.332 L407.5,765.332 L254.5,765.332 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153" x="257.5" y="760.2559">Paso 4: leer el elemento</text><path d="M391.5,775.332 L391.5,829.1602 L371.5,833.1602 L391.5,837.1602 L391.5,890.9883 A0,0 0 0 0 391.5,890.9883 L546.5,890.9883 A0,0 0 0 0 546.5,890.9883 L546.5,785.332 L536.5,775.332 L391.5,775.332 A0,0 0 0 0 391.5,775.332 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M536.5,775.332 L536.5,785.332 L546.5,785.332 L536.5,775.332 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="66" x="397.5" y="792.7891">p[j] &#8801; *(p + j)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="397.5" y="807.8828">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126" x="397.5" y="822.9766">Aritm&#233;tica de punteros:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134" x="397.5" y="838.0703">avanza j * sizeof(T) bytes</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87" x="397.5" y="853.1641">y desreferencia.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="397.5" y="868.2578">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121" x="397.5" y="883.3516">Devuelve un T (copia).</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="107" x="264.5" y="814.9844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87" x="274.5" y="838.4795">elemento = p[j]</text><rect fill="#F8F8F8" height="85.9609" style="stroke:#A80036;stroke-width:1.5;" width="130" x="253" y="912.9883"/><path d="M302,912.9883 L302,923.5977 L292,933.5977 L253,933.5977 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="256" y="928.5215">Salida</text><rect fill="#FEFECE" height="36.3516" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="110" x="263" y="950.5977"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="273" y="974.0928">return elemento</text><path d="M44,1008.9492 L44,1200.0742 A0,0 0 0 0 44,1200.0742 L287,1200.0742 A0,0 0 0 0 287,1200.0742 L287,1108.5117 L307,1104.5117 L287,1100.5117 L287,1018.9492 L277,1008.9492 L44,1008.9492 A0,0 0 0 0 44,1008.9492 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M277,1008.9492 L277,1018.9492 L287,1018.9492 L277,1008.9492 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="75" x="50" y="1026.4063">Estado inicial</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105" x="50" y="1041.5">i    = &#237;ndice recibido</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97" x="50" y="1056.5938">n    = sin cambios</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117" x="50" y="1071.6875">blocks = sin cambios</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="50" y="1086.7813">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="66" x="50" y="1101.875">Estado final</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159" x="50" y="1116.9688">Devuelve el T en la posici&#243;n i</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97" x="50" y="1132.0625">n    = sin cambios</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117" x="50" y="1147.1563">blocks = sin cambios</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="50" y="1162.25">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="73" x="50" y="1177.3438">Complejidad:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="24" x="126" y="1177.3438">O(1)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222" x="50" y="1192.4375">i2b + blocks.get + aritm&#233;tica de punteros</text><ellipse cx="318" cy="1104.5117" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="318" cy="1104.5117" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="318" x2="318" y1="134.0469" y2="232.4844"/><polygon fill="#A80036" points="314,222.4844,318,232.4844,322,222.4844,318,226.4844" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="318" x2="318" y1="268.8359" y2="363.0156"/><polygon fill="#A80036" points="314,353.0156,318,363.0156,322,353.0156,318,357.0156" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="318" x2="318" y1="399.3672" y2="523.7344"/><polygon fill="#A80036" points="314,513.7344,318,523.7344,322,513.7344,318,517.7344" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="318" x2="318" y1="560.0859" y2="669.3594"/><polygon fill="#A80036" points="314,659.3594,318,669.3594,322,659.3594,318,663.3594" style="stroke:#A80036;stroke-width:1.0;"/><line style="stroke:#A80036;stroke-width:1.0;" x1="318" x2="318" y1="705.7109" y2=