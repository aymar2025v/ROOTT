<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1333px" preserveAspectRatio="none" style="width:456px;height:1333px;background:#FFFFFF;" version="1.1" viewBox="0 0 456 1333" width="456px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="157.4375" x="148.0313" y="34.5332">i2b(i) &#8212; Index to Block</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402" x="25.75" y="52.1426">Dado un &#237;ndice l&#243;gico i, devuelve el bloque b donde vive</text><path d="M10,66.2188 L10,288.7891 L262,288.7891 L262,76.2188 L252,66.2188 L10,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M252,66.2188 L252,76.2188 L262,76.2188 L252,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="16" y="84.7139">Idea</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="16" y="101.0654">Los bloques tienen tama&#241;os crecientes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="16" y="117.417">Bloque 0: 1 elemento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="16" y="133.7686">Bloque 1: 2 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="16" y="150.1201">Bloque 2: 3 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="12" x="16" y="166.4717">...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145" x="16" y="182.8232">Bloque b: b+1 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="16" y="199.1748">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185" x="16" y="215.5264">El &#250;ltimo &#237;ndice del bloque b es:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.4063" x="16" y="231.8779">(b+1)(b+2)/2 &#8722; 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="16" y="248.2295">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168" x="16" y="264.5811">Queremos el menor b tal que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="16" y="280.9326">i &#8804; (b+1)(b+2)/2 &#8722; 1</text><ellipse cx="136" cy="308.7891" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F8F8F8" height="91.5078" style="stroke:#A80036;stroke-width:1.5;" width="392" x="53.5" y="328.7891"/><path d="M113.5,328.7891 L113.5,339.3984 L103.5,349.3984 L53.5,349.3984 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50" x="56.5" y="344.3223">Entrada</text><path d="M228.5,365.5938 L228.5,382.9453 L208.5,386.9453 L228.5,390.9453 L228.5,408.2969 A0,0 0 0 0 228.5,408.2969 L435.5,408.2969 A0,0 0 0 0 435.5,408.2969 L435.5,375.5938 L425.5,365.5938 L228.5,365.5938 A0,0 0 0 0 228.5,365.5938 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M425.5,365.5938 L425.5,375.5938 L435.5,375.5938 L425.5,365.5938 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="234.5" y="384.0889">Condici&#243;n: 0 &#8804; i &lt; n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="234.5" y="400.4404">No se modifica ning&#250;n miembro.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="145" x="63.5" y="369.3984"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125" x="73.5" y="391.8555">Recibe i (&#237;ndice l&#243;gico)</text><rect fill="#F8F8F8" height="167.0703" style="stroke:#A80036;stroke-width:1.5;" width="396" x="15.5" y="430.2969"/><path d="M205.5,430.2969 L205.5,440.9063 L195.5,450.9063 L15.5,450.9063 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180" x="18.5" y="445.8301">Paso 1: plantear la ecuaci&#243;n</text><path d="M266.5,460.9063 L266.5,519.1367 L246.5,523.1367 L266.5,527.1367 L266.5,585.3672 A0,0 0 0 0 266.5,585.3672 L401.5,585.3672 A0,0 0 0 0 401.5,585.3672 L401.5,470.9063 L391.5,460.9063 L266.5,460.9063 A0,0 0 0 0 266.5,460.9063 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M391.5,460.9063 L391.5,470.9063 L401.5,470.9063 L391.5,460.9063 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="272.5" y="479.4014">i = (b+1)(b+2)/2 &#8722; 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="272.5" y="495.7529">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55" x="272.5" y="512.1045">Despejar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="272.5" y="528.4561">2i = (b+1)(b+2) &#8722; 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="272.5" y="544.8076">2i = b&#178; + 3b + 2 &#8722; 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="272.5" y="561.1592">2i = b&#178; + 3b</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91" x="272.5" y="577.5107">b&#178; + 3b &#8722; 2i = 0</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="221" x="25.5" y="505.5898"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201" x="35.5" y="528.0469">Igualar i al &#250;ltimo &#237;ndice del bloque b</text><rect fill="#F8F8F8" height="187.0703" style="stroke:#A80036;stroke-width:1.5;" width="351" x="52.5" y="607.3672"/><path d="M250.5,607.3672 L250.5,617.9766 L240.5,627.9766 L52.5,627.9766 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188" x="55.5" y="622.9004">Paso 2: resolver la cuadr&#225;tica</text><path d="M229.5,637.9766 L229.5,671.6797 L209.5,675.6797 L229.5,679.6797 L229.5,713.3828 A0,0 0 0 0 229.5,713.3828 L393.5,713.3828 A0,0 0 0 0 393.5,713.3828 L393.5,647.9766 L383.5,637.9766 L229.5,637.9766 A0,0 0 0 0 229.5,637.9766 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M383.5,637.9766 L383.5,647.9766 L393.5,647.9766 L383.5,637.9766 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="235.5" y="656.4717">b = (&#8722;3 &#177; &#8730;(9 + 8i)) / 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="235.5" y="672.8232">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143" x="235.5" y="689.1748">Tomamos la ra&#237;z positiva</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78" x="235.5" y="705.5264">porque b &#8805; 0.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="147" x="62.5" y="658.1328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127" x="72.5" y="680.5898">Aplicar f&#243;rmula general</text><path d="M229.5,723.3828 L229.5,748.9102 L209.5,752.9102 L229.5,756.9102 L229.5,782.4375 A0,0 0 0 0 229.5,782.4375 L368.5,782.4375 A0,0 0 0 0 368.5,782.4375 L368.5,733.3828 L358.5,723.3828 L229.5,723.3828 A0,0 0 0 0 229.5,723.3828 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M358.5,723.3828 L358.5,733.3828 L368.5,733.3828 L358.5,723.3828 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41" x="235.5" y="741.8779">Se usa</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44" x="280.5" y="741.8779">double</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25" x="328.5" y="741.8779">para</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="235.5" y="758.2295">no perder precisi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="235.5" y="774.5811">antes del redondeo.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="147" x="62.5" y="735.3633"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127" x="72.5" y="757.8203">db = (&#8722;3 + &#8730;(9 + 8i)) / 2</text><rect fill="#F8F8F8" height="238.5156" style="stroke:#A80036;stroke-width:1.5;" width="321" x="78.5" y="804.4375"/><path d="M285.5,804.4375 L285.5,815.0469 L275.5,825.0469 L78.5,825.0469 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197" x="81.5" y="819.9707">Paso 3: redondear hacia arriba</text><path d="M196.5,835.0469 L196.5,901.4531 L176.5,905.4531 L196.5,909.4531 L196.5,975.8594 A0,0 0 0 0 196.5,975.8594 L389.5,975.8594 A0,0 0 0 0 389.5,975.8594 L389.5,845.0469 L379.5,835.0469 L196.5,835.0469 A0,0 0 0 0 196.5,835.0469 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M379.5,835.0469 L379.5,845.0469 L389.5,845.0469 L379.5,835.0469 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="202.5" y="853.542">Necesitamos el menor bloque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="202.5" y="869.8936">cuyo &#250;ltimo &#237;ndice sea &#8805; i.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45" x="202.5" y="886.2451">Por eso</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="23" x="251.5" y="886.2451">ceil</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54" x="274.5" y="886.2451">, no floor.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="202.5" y="902.5967">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="202.5" y="918.9482">ceil(0.0)  = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="202.5" y="935.2998">ceil(0.56) = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="202.5" y="951.6514">ceil(1.0)  = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="202.5" y="968.0029">ceil(1.37) = 2</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="81" x="95.5" y="887.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="61" x="105.5" y="910.3633">b = ceil(db)</text><path d="M203.5,1000.2305 L203.5,1009.4063 L183.5,1013.4063 L203.5,1017.4063 L203.5,1026.582 A0,0 0 0 0 203.5,1026.582 L314.5,1026.582 A0,0 0 0 0 314.5,1026.582 L314.5,1010.2305 L304.5,1000.2305 L203.5,1000.2305 A0,0 0 0 0 203.5,1000.2305 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M304.5,1000.2305 L304.5,1010.2305 L314.5,1010.2305 L304.5,1000.2305 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="209.5" y="1018.7256">(int)std::ceil(db)</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="95" x="88.5" y="995.8594"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="98.5" y="1018.3164">Convertir a int</text><rect fill="#F8F8F8" height="84.7031" style="stroke:#A80036;stroke-width:1.5;" width="82" x="95" y="1052.9531"/><path d="M144,1052.9531 L144,1063.5625 L134,1073.5625 L95,1073.5625 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="98" y="1068.4863">Salida</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="62" x="105" y="1090.5625"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="42" x="115" y="1113.0195">return b</text><path d="M167,1147.6563 L