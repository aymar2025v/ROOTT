<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1286px" preserveAspectRatio="none" style="width:668px;height:1286px;background:#FFFFFF;" version="1.1" viewBox="0 0 668 1286" width="668px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="157.4375" x="254.0313" y="34.5332">i2b(i) &#8212; Index to Block</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402" x="131.75" y="52.1426">Dado un &#237;ndice l&#243;gico i, devuelve el bloque b donde vive</text><path d="M10,66.2188 L10,272.4375 A0,0 0 0 0 10,272.4375 L318,272.4375 A0,0 0 0 0 318,272.4375 L318,173.3281 L338,169.3281 L318,165.3281 L318,76.2188 L308,66.2188 L10,66.2188 A0,0 0 0 0 10,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M308,66.2188 L308,76.2188 L318,76.2188 L308,66.2188 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="16" y="84.7139">Idea</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231" x="16" y="101.0654">Los bloques tienen tama&#241;os crecientes:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123" x="16" y="117.417">Bloque 0: 1 elemento</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="16" y="133.7686">Bloque 1: 2 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="16" y="150.1201">Bloque 2: 3 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="12" x="16" y="166.4717">...</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145" x="16" y="182.8232">Bloque b: b+1 elementos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="16" y="199.1748">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185" x="16" y="215.5264">El &#250;ltimo &#237;ndice del bloque b es:</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.4063" x="16" y="231.8779">(b+1)(b+2)/2 &#8722; 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="16" y="248.2295">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287" x="16" y="264.5811">Queremos el menor b tal que i &#8804; (b+1)(b+2)/2 &#8722; 1</text><ellipse cx="348" cy="169.3281" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F8F8F8" height="91.5078" style="stroke:#A80036;stroke-width:1.5;" width="392" x="265.5" y="282.4375"/><path d="M325.5,282.4375 L325.5,293.0469 L315.5,303.0469 L265.5,303.0469 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50" x="268.5" y="297.9707">Entrada</text><path d="M440.5,319.2422 L440.5,336.5938 L420.5,340.5938 L440.5,344.5938 L440.5,361.9453 A0,0 0 0 0 440.5,361.9453 L647.5,361.9453 A0,0 0 0 0 647.5,361.9453 L647.5,329.2422 L637.5,319.2422 L440.5,319.2422 A0,0 0 0 0 440.5,319.2422 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M637.5,319.2422 L637.5,329.2422 L647.5,329.2422 L637.5,319.2422 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="446.5" y="337.7373">Condici&#243;n: 0 &#8804; i &lt; n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186" x="446.5" y="354.0889">No se modifica ning&#250;n miembro.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="145" x="275.5" y="323.0469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125" x="285.5" y="345.5039">Recibe i (&#237;ndice l&#243;gico)</text><rect fill="#F8F8F8" height="167.0703" style="stroke:#A80036;stroke-width:1.5;" width="396" x="227.5" y="383.9453"/><path d="M417.5,383.9453 L417.5,394.5547 L407.5,404.5547 L227.5,404.5547 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180" x="230.5" y="399.4785">Paso 1: plantear la ecuaci&#243;n</text><path d="M478.5,414.5547 L478.5,472.7852 L458.5,476.7852 L478.5,480.7852 L478.5,539.0156 A0,0 0 0 0 478.5,539.0156 L613.5,539.0156 A0,0 0 0 0 613.5,539.0156 L613.5,424.5547 L603.5,414.5547 L478.5,414.5547 A0,0 0 0 0 478.5,414.5547 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M603.5,414.5547 L603.5,424.5547 L613.5,424.5547 L603.5,414.5547 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="484.5" y="433.0498">i = (b+1)(b+2)/2 &#8722; 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="484.5" y="449.4014">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55" x="484.5" y="465.7529">Despejar:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="484.5" y="482.1045">2i = (b+1)(b+2) &#8722; 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="484.5" y="498.4561">2i = b&#178; + 3b + 2 &#8722; 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="484.5" y="514.8076">2i = b&#178; + 3b</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91" x="484.5" y="531.1592">b&#178; + 3b &#8722; 2i = 0</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="221" x="237.5" y="459.2383"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201" x="247.5" y="481.6953">Igualar i al &#250;ltimo &#237;ndice del bloque b</text><rect fill="#F8F8F8" height="187.0703" style="stroke:#A80036;stroke-width:1.5;" width="351" x="264.5" y="561.0156"/><path d="M462.5,561.0156 L462.5,571.625 L452.5,581.625 L264.5,581.625 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188" x="267.5" y="576.5488">Paso 2: resolver la cuadr&#225;tica</text><path d="M441.5,591.625 L441.5,625.3281 L421.5,629.3281 L441.5,633.3281 L441.5,667.0313 A0,0 0 0 0 441.5,667.0313 L605.5,667.0313 A0,0 0 0 0 605.5,667.0313 L605.5,601.625 L595.5,591.625 L441.5,591.625 A0,0 0 0 0 441.5,591.625 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M595.5,591.625 L595.5,601.625 L605.5,601.625 L595.5,591.625 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="447.5" y="610.1201">b = (&#8722;3 &#177; &#8730;(9 + 8i)) / 2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="447.5" y="626.4717">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143" x="447.5" y="642.8232">Tomamos la ra&#237;z positiva</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78" x="447.5" y="659.1748">porque b &#8805; 0.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="147" x="274.5" y="611.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127" x="284.5" y="634.2383">Aplicar f&#243;rmula general</text><path d="M441.5,677.0313 L441.5,702.5586 L421.5,706.5586 L441.5,710.5586 L441.5,736.0859 A0,0 0 0 0 441.5,736.0859 L580.5,736.0859 A0,0 0 0 0 580.5,736.0859 L580.5,687.0313 L570.5,677.0313 L441.5,677.0313 A0,0 0 0 0 441.5,677.0313 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M570.5,677.0313 L570.5,687.0313 L580.5,687.0313 L570.5,677.0313 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="41" x="447.5" y="695.5264">Se usa</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44" x="492.5" y="695.5264">double</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25" x="540.5" y="695.5264">para</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110" x="447.5" y="711.8779">no perder precisi&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="447.5" y="728.2295">antes del redondeo.</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="147" x="274.5" y="689.0117"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127" x="284.5" y="711.4688">db = (&#8722;3 + &#8730;(9 + 8i)) / 2</text><rect fill="#F8F8F8" height="238.5156" style="stroke:#A80036;stroke-width:1.5;" width="321" x="290.5" y="758.0859"/><path d="M497.5,758.0859 L497.5,768.6953 L487.5,778.6953 L290.5,778.6953 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197" x="293.5" y="773.6191">Paso 3: redondear hacia arriba</text><path d="M408.5,788.6953 L408.5,855.1016 L388.5,859.1016 L408.5,863.1016 L408.5,929.5078 A0,0 0 0 0 408.5,929.5078 L601.5,929.5078 A0,0 0 0 0 601.5,929.5078 L601.5,798.6953 L591.5,788.6953 L408.5,788.6953 A0,0 0 0 0 408.5,788.6953 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M591.5,788.6953 L591.5,798.6953 L601.5,798.6953 L591.5,788.6953 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172" x="414.5" y="807.1904">Necesitamos el menor bloque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="414.5" y="823.542">cuyo &#250;ltimo &#237;ndice sea &#8805; i.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45" x="414.5" y="839.8936">Por eso</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="23" x="463.5" y="839.8936">ceil</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54" x="486.5" y="839.8936">, no floor.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="414.5" y="856.2451">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="414.5" y="872.5967">ceil(0.0)  = 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="414.5" y="888.9482">ceil(0.56) = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="414.5" y="905.2998">ceil(1.0)  = 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="414.5" y="921.6514">ceil(1.37) = 2</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="81" x="307.5" y="841.5547"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="61" x="317.5" y="864.0117">b = ceil(db)</text><path d="M415.5,953.8789 L415.5,963.0547 L395.5,967.0547 L415.5,971.0547 L415.5,980.2305 A0,0 0 0 0 415.5,980.2305 L526.5,980.2305 A0,0 0 0 0 526.5,980.2305 L526.5,963.8789 L516.5,953.8789 L415.5,953.8789 A0,0 0 0 0 415.5,953.8789 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><path d="M516.5,953.8789 L516.5,963.8789 L526.5,963.8789 L516.5,953.8789 " fill="#FBFB77" style="stroke:#A80036;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="421.5" y="972.374">(int)std::ceil(db)</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="95" x="300.5" y="949.5078"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75" x="310.5" y="971.9648">Convertir a int</text><rect fill="#F8F8F8" height="84.7031" style="stroke:#A80036;stroke-width:1.5;" width="82" x="307" y="1006.6016"/><path d="M356,1006.6016 L356,1017.2109 L346,1027.2109 L307,1027.2109 " fill="none" style="stroke:#A80036;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39" x="310" y="1022.1348">Salida</text><rect fill="#FEFECE" height="35.0938" rx="12.5" ry="12.5" style="stroke:#A80036;stroke-width:0.5;" width="62" x="317" y="1044.2109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="42" x="327" y="1066.668">return b</text><path d="M135,1101.3047 L135,1274.8203 A0,